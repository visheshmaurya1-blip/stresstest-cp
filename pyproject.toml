[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stresstest-cp"
version = "0.1.0"
description = "Find bugs in competitive programming solutions using randomized differential testing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "StressTest CP contributors" }]
keywords = ["competitive-programming", "differential-testing", "fuzzing", "delta-debugging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stresstest = "stresstest_cp.cli:main"

[project.urls]
Homepage = "https://github.com/visheshmaurya1-blip/stresstest-cp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
